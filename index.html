<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1e8;
      color: #203b35;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background-image: radial-gradient(#203b3518 0.7px, transparent 0.7px);
      background-size: 14px 14px;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 400;
      line-height: 1;
    }

    p {
      margin: 1.25rem 0 0;
      color: #a34f36;
      font: 600 0.75rem/1.4 ui-monospace, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world!</h1>
    <p>A little page on the web</p>
  </main>
</body>
</html>

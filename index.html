<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Contemplative Fuggler</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1e8;
      color: #203b35;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background-image: radial-gradient(#203b3518 0.7px, transparent 0.7px);
      background-size: 14px 14px;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    figure {
      margin: 0;
    }

    img {
      display: block;
      max-width: min(90vw, 720px);
      max-height: 78vh;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-inline: auto;
    }

    figcaption {
      margin-top: 0.75rem;
      color: #a34f36;
      font: 0.75rem/1.4 ui-monospace, monospace;
    }

    figcaption a {
      color: inherit;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <img
        src="images/contemplative_sexybeast_fuggler-PxnWMx8E.jpg"
        alt="A contemplative Fuggler plush toy"
      >
      <figcaption>
        From:
        <a href="https://www.louisemcg.com">
          louisemcg.com
        </a>
      </figcaption>
    </figure>
  </main>
</body>
</html>
